  <text x="72" y="76" fill="#F4F5F8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">MemoraeAI Intelligence Flow</text>
  <text x="72" y="104" fill="#9198AA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Raw observations stay immutable. Every answer is rebuilt from evidence, graph paths, and snapshot-safe context.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="104" y="164" fill="#8B5CF6" font-size="13" font-weight="700" letter-spacing="2">01 SOURCES</text>
    <text x="104" y="195" fill="#F4F5F8" font-size="22" font-weight="700">Notes + meetings</text>
    <text x="104" y="220" fill="#9198AA" font-size="14">Messages, email, tasks, voice</text>
    <text x="334" y="164" fill="#22D3EE" font-size="13" font-weight="700" letter-spacing="2">02 INGEST</text>
    <text x="334" y="195" fill="#F4F5F8" font-size="22" font-weight="700">Event log</text>
    <text x="334" y="220" fill="#9198AA" font-size="14">CDC, lineage, quality checks</text>
    <text x="564" y="164" fill="#34D399" font-size="13" font-weight="700" letter-spacing="2">03 EXTRACT</text>
    <text x="564" y="195" fill="#F4F5F8" font-size="22" font-weight="700">Signals</text>
    <text x="564" y="220" fill="#9198AA" font-size="14">Tasks, deadlines, entities</text>
    <text x="794" y="164" fill="#8B5CF6" font-size="13" font-weight="700" letter-spacing="2">04 CONNECT</text>
    <text x="794" y="195" fill="#F4F5F8" font-size="22" font-weight="700">Graph + memory</text>
    <text x="794" y="220" fill="#9198AA" font-size="14">Evidence-linked projections</text>
    <text x="1024" y="164" fill="#FBBF24" font-size="13" font-weight="700" letter-spacing="2">05 ANSWER</text>
    <text x="1024" y="195" fill="#F4F5F8" font-size="22" font-weight="700">Supported claims</text>
    <text x="1024" y="220" fill="#9198AA" font-size="14">Context quality + trace validation</text>
    <text x="334" y="344" fill="#22D3EE" font-size="13" font-weight="700" letter-spacing="2">RETRIEVAL</text>
    <text x="334" y="375" fill="#F4F5F8" font-size="22" font-weight="700">Broad-first recall</text>
    <text x="334" y="400" fill="#9198AA" font-size="14">BM25 + lightweight vectors</text>
    <text x="564" y="344" fill="#34D399" font-size="13" font-weight="700" letter-spacing="2">EXPANSION</text>
    <text x="564" y="375" fill="#F4F5F8" font-size="22" font-weight="700">GraphRAG paths</text>
    <text x="564" y="400" fill="#9198AA" font-size="14">Entity, temporal, dependency hops</text>
    <text x="794" y="344" fill="#8B5CF6" font-size="13" font-weight="700" letter-spacing="2">GUARDRAILS</text>
    <text x="794" y="375" fill="#F4F5F8" font-size="22" font-weight="700">Point-in-time truth</text>
    <text x="794" y="400" fill="#9198AA" font-size="14">No future leakage or stale claims</text>
